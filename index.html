<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Study flow</h1>
        <p class="subtitle">Study smarter.</p>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="active">
                Active
            </button>

            <button class="filter" data-filter="completed">
                Completed
            </button>
        </div>

        <ul id="taskList"></ul>

        <div class="bottom">
            <span id="taskCount">0 tasks remaining</span>

            <button id="clearCompleted">
                Clear Completed
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
